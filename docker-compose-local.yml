services:
  9router:
    build: .
    image: 9router:local
    container_name: 9router
    ports:
      - "20128:20128"
    volumes:
      - /data/volume/9router:/app/data
    environment:
      DATA_DIR: /app/data
      TZ: Asia/Shanghai
      NEXT_TELEMETRY_DISABLED: "1"
      OBSERVABILITY_ENABLED: "true"
      INITIAL_PASSWORD: 9router
      JWT_SECRET: c801d80d43e2b2b3d5a0e08de0c9b1da9efddfa901ef97d9f37f4bcd4222eaf8
    restart: unless-stopped
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 3

networks:
  my-service-net:
    external: true
